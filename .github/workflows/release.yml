name: Release Debian package

on:
  push:
    tags:
      - "omp-web-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build omp-web .deb
    runs-on: [self-hosted, Linux, X64, omp-web]
    # `debian/rules` wraps the flaky `bun run build` (next build --webpack)
    # in debian/retry-build.sh (omp-web#41): an output-inactivity-based
    # retry, up to 3 attempts, each capped at 35 min. Worst case for the
    # build step alone: 3 x 35min = 105 min. Add ~15 min of headroom for the
    # surrounding non-retried steps (checkout, bun installs, secrets
    # assembly/seed fetch, dpkg-buildpackage packaging, artifact upload) =>
    # 120 min. A normal, non-stalled build still finishes in ~14-29 min, as
    # before — this budget only matters when a stall is actually hit.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          changelog_version="$(dpkg-parsechangelog -S Version)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#omp-web-v}"
            if [[ "$tag_version" != "$changelog_version" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match debian/changelog version ${changelog_version}" >&2
              exit 1
            fi
            echo "version=$changelog_version" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: a distinct, non-colliding test version per
            # docs/workspace/joysort2026 release-hardening-rules.md ("Do not
            # use ~ for test builds"; apt sorts a bare +suffix higher, never
            # replacing a formal tagged version in the repo). This build job
            # produces an artifact only — the publish job below never runs
            # for workflow_dispatch, so this version never reaches the apt
            # repo (Design decision 3).
            echo "version=${changelog_version}+github.action.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved build version: $(cat "$GITHUB_OUTPUT" | tail -1)"

      - name: Apply resolved version to debian/changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "1s/(${CHANGELOG_VER:-$(dpkg-parsechangelog -S Version)})/($VERSION)/" debian/changelog
          head -3 debian/changelog

      - name: Build .deb
        env:
          OMP_WEB_OWNER_SECRETS: /home/joysort/joysort-release-credential/omp-web-secrets.env.plain
          OMP_WEB_ASSEMBLED_SECRETS: /home/joysort/joysort-release-credential/omp-web-secrets.assembled.env.plain
        run: ./build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: omp-web-deb-${{ steps.version.outputs.version }}
          path: debian_dist/*.deb
          retention-days: 30

  publish:
    name: Publish to the R2 apt repository
    needs: build
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, Linux, X64, omp-web]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: omp-web-deb-${{ needs.build.outputs.version }}
          path: .

      # joysort-release-tools holds the canonical update-apt-repo composite
      # action. On the self-hosted runner it lives at
      # /home/joysort/joysort-release-tools (a pre-existing git clone). This
      # step self-heals: git-pull if present, git-clone if absent, then copies
      # into the workspace so the action resolves via `./joysort-release-tools`.
      # This avoids the cross-org private-action resolution problem entirely —
      # no GH_PAT, no repo-visibility change — and survives a runner rebuild.
      # If the runner loses SSH access to JoySort org repos, the clone step
      # will fail loudly here (before the publish step), not silently use stale
      # release logic.
      - name: Stage joysort-release-tools (self-healing clone or pull)
        shell: bash
        run: |
          set -eu
          SRC="/home/joysort/joysort-release-tools"
          if [ -d "$SRC/.git" ]; then
            git -C "$SRC" pull --ff-only --quiet || true
          else
            rm -rf "$SRC"
            git clone --depth 1 https://github.com/JoySort/joysort-release-tools "$SRC"
          fi
          # Verify the composite action actually exists (fail loudly if stale)
          test -f "$SRC/.github/actions/update-apt-repo/action.yml" \
            || { echo "ERROR: update-apt-repo action.yml not found in $SRC" >&2; exit 1; }
          rm -rf ./joysort-release-tools
          cp -a "$SRC" ./joysort-release-tools

      - name: Update APT repository metadata
        uses: ./joysort-release-tools/.github/actions/update-apt-repo
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.R2_BUCKET }}
          gpg-private-key: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.REPO_GPG_PASSPHRASE }}
          codename: jammy
          # R2 apt-repo retention (issue #40): keep the most recent 20
          # versions of each package in the pool, pruning older ones after
          # every successful publish. Does not retroactively delete
          # anything outside this step's own prune pass.
          max-versions: '20'

      - name: Verify the package landed in the apt repo
        shell: bash
        run: |
          curl -fsS "https://repo.joysort.cc/apt/dists/jammy/main/binary-amd64/Packages" \
            | grep -A2 "^Package: omp-web$"
          curl -fsS "https://repo.joysort.cc/apt/dists/jammy/main/binary-amd64/Packages" \
            | grep -A2 "^Package: omp-web$" | grep -q "Version: ${{ needs.build.outputs.version }}"
